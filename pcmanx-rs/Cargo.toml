[package]
name    = "pcmanx-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pcmanx"
path = "src/main.rs"

[lib]
name = "pcmanx_rs"
path = "src/lib.rs"

[dependencies]
tokio         = { version = "1", features = ["full"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
encoding_rs   = "0.8"
vte           = "0.13"
unicode-width = "0.1"
dirs          = "5"
anyhow        = "1"
thiserror     = "1"
log           = "0.4"
env_logger    = "0.11"

# GTK4 UI
gtk4         = { version = "0.9", features = ["v4_6"] }
glib         = "0.20"
gio          = "0.20"
cairo-rs     = { version = "0.20", features = ["use_glib"] }
pango        = "0.20"
pangocairo   = "0.20"
gdk4         = "0.9"

# Async + GTK integration
async-channel = "2"

# Desktop notifications (libnotify via D-Bus)
notify-rust  = { version = "4", default-features = false, features = ["d"] }

[dev-dependencies]
tokio         = { version = "1", features = ["full", "test-util"] }
